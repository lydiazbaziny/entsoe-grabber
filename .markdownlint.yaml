# Default state for all rules
default: true

# MD024/no-duplicate-heading/no-duplicate-header - Multiple headings with the same content
MD024:
    siblings_only: true

# MD013/line-length - Line length
MD013:
    code_blocks: false
    tables: false
    line_length: 88

# MD033/no-inline-html - raw HTML is not allowed in a pure md document
MD033:
    allowed_elements: [img]

# MD045/no-alt-text
MD045: false
