[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling==1.32" ]

[project]
name = "entsoe-grabber"
version = "0.1.0"
description = "AWS Lambda that pulls ENTSO-E Transparency Platform data into S3"
readme = "README.md"
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
# Packaged into the deployment zip rather than taken from the runtime, so the
# function pins its own versions instead of drifting when AWS updates the
# runtime's bundled SDK.
dependencies = [ "boto3==1.43.*", "requests==2.34.*" ]

[dependency-groups]
dev = [
  "boto3-stubs[s3,ssm]==1.43.*",
  "moto[s3,ssm]==5.2.*",
  "mypy==2.3.*",
  "pre-commit==4.6.*",
  "pytest==9.1.*",
  "pytest-cov==7.1.*",
  "responses==0.26.*",
  "ruff==0.16.*",
  "types-requests==2.33.0.*",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/entsoe_grabber" ]

[tool.ruff]
target-version = "py314"
line-length = 88
src = [ "src", "tests" ]
lint.select = [ "B", "C901", "D", "E", "F", "I", "N", "RUF", "SIM", "UP", "W" ]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."conftest.py" = [ "D", "F401" ]
lint.per-file-ignores."tests/*.py" = [ "D" ]
lint.isort.known-first-party = [ "entsoe_grabber" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "-q --strict-markers"

[tool.coverage]
run.branch = true
run.data_file = ".coverage_files/.coverage"
run.omit = [ "*/tests/*", "conftest.py" ]
run.source = [ "entsoe_grabber" ]

[tool.mypy]
python_version = "3.14"
files = [ "src", "tests" ]
strict = true
